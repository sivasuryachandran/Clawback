<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawback</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="style.css?v=1795159764">
</head>
<body>
<div id="app">
  <aside id="rail">
    <a class="brand" href="#money"><img id="logo" src="logo.svg" alt=""><span>Clawback</span></a>
    <nav>
      <a href="#money" data-tab="money"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span></a>
      <a href="#needs" data-tab="needs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Needs your OK</span><i id="badge" hidden></i></a>
      <a href="#purchases" data-tab="purchases"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8zM9 8a3 3 0 016 0"/></svg><span>Purchases</span></a>
      <a href="#activity" data-tab="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Activity</span></a>
      <a href="#schedules" data-tab="schedules"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>Schedule</span></a>
      <a href="#pact" data-tab="pact"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg><span>Your Pact</span></a>
    </nav>
    <div class="rail-foot">
      <div id="pactchip" class="pactchip" hidden></div>
      <label class="switch" title="Show the technical trail"><input type="checkbox" id="details"><span>Show details</span></label>
      <div class="links"><a href="#about" data-tab="about">About</a><a href="#" id="uth">Under the hood</a></div>
    </div>
  </aside>
  <div id="col">
    <header id="top"><a class="brand" href="#money"><img src="logo.svg" alt=""><span>Clawback</span></a><div class="topr"><a href="#about" class="hdr-about">About</a><label class="switch"><input type="checkbox" id="details2"><span>Details</span></label></div></header>
    <div id="center">
      <div id="orb-wrap">
        <button id="orbbtn" type="button" aria-label="Ask Clawback"><div id="orb" class="core-sphere" role="img" aria-label="Clawback orb"></div></button>
        <div class="orb-state" id="orb-state">idle</div>
        <div class="orb-hint" id="orb-hint">Click the sphere and speak, or type below</div>
        <div id="ask" hidden>
          <div id="answer" aria-live="polite"></div>
          <form id="askform"><input id="asktext" placeholder="Or type a question and press Enter" autocomplete="off"></form>
        </div>
      </div>
      <main id="view"></main>
    </div>
  </div>
  <aside id="side"></aside>
</div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="orb.js?v=1795159764"></script>
<script src="voice.js?v=1795159764"></script>
<script src="app.js?v=1795159764"></script>
</body>
</html>
