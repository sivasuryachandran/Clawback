<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Clawback">
  <defs>
    <linearGradient id="g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="bg" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#14304a"/><stop offset="1" stop-color="#070b14"/></radialGradient>
  </defs>
  <!-- the orb -->
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="url(#g)" stroke-width="1.5" opacity=".95"/>
  <ellipse cx="32" cy="32" rx="29" ry="10" fill="none" stroke="url(#g)" stroke-width=".7" opacity=".28"/>
  <ellipse cx="32" cy="32" rx="10" ry="29" fill="none" stroke="url(#g)" stroke-width=".7" opacity=".28"/>
  <!-- a "C" that pulls back toward the coin: claw + return arrow -->
  <path d="M43.7 19.5 A17 17 0 1 0 43.7 44.5" fill="none" stroke="url(#g)" stroke-width="6.5" stroke-linecap="round"/>
  <g transform="translate(43.2 44.2) rotate(-43)"><path d="M6.5 0 L-2.5 -5.5 L-2.5 5.5 Z" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/></g>
  <!-- the coin it brings back, with a check: only inside the Pact -->
  <circle cx="35" cy="32" r="7.5" fill="url(#g)"/>
  <path d="M31.4 32.2 l2.6 2.6 l4.6 -5" fill="none" stroke="#070b14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
